<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Referees — NFC</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script>
const REFEREES = [
  { name:"Thomas Strand", slug:"ref-thomas", nickname:"To The Death", officiated:8, photo:"ref-thomas.jpg" },
  { name:"Stephen Grove", slug:"ref-stephen", nickname:"If He Dies He Dies", officiated:1, photo:"ref-stephen.jpg" }
];
const NFC_SOCIALS = {
  youtube: "https://www.youtube.com/playlist?list=PLOVVnXw7vnioi8JdVCJgEnHuXR89VmVWb",
  tiktok: "https://www.tiktok.com/@nfc.com1",
  instagram: "https://www.instagram.com/nfc.com1/"
};
</script>
<style>
  :root{
    --bg:#ffffff; --bg-raised:#f4f3f1; --line:#e2e0da; --ink:#111111; --ink-dim:#68655f;
    --red:#d20a11; --brass:#8a6a1f; --near-black:#111111; box-sizing:border-box;
  }
  *,*::before,*::after{ box-sizing:inherit; }
  html{ scroll-padding-top: env(safe-area-inset-top,0px); overflow-x:hidden; max-width:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Archivo',system-ui,sans-serif; padding-top:env(safe-area-inset-top,0px); -webkit-font-smoothing:antialiased; padding-bottom:64px; }
  .display{ font-family:'Anton',Impact,sans-serif; font-weight:400; letter-spacing:0.01em; line-height:0.92; }
  a{ color:inherit; }
  .wrap{ max-width:1240px; margin:0 auto; padding:0 24px; }
  button{ font-family:inherit; }

  header{ position:sticky; top:0; z-index:50; background:var(--bg-raised); border-bottom:1px solid transparent; padding-top:calc(env(safe-area-inset-top,0px) + 12px); padding-bottom:12px; transition:background .35s ease, border-color .35s ease, box-shadow .35s ease, padding .35s ease; }
  header.nav-scrolled{ background:var(--near-black); border-bottom-color:var(--near-black); box-shadow:0 8px 22px rgba(0,0,0,0.28); padding-top:env(safe-area-inset-top,0px); padding-bottom:0; }
  .topbar{ display:grid; grid-template-columns:1fr auto 1fr; align-items:stretch; height:60px; background:#fff; border-radius:14px; box-shadow:0 3px 16px rgba(17,17,17,0.10); transition:height .35s ease, border-radius .35s ease, box-shadow .35s ease, background .35s ease;}
  header.nav-scrolled .topbar{ height:80px; border-radius:0; box-shadow:none; background:transparent; }
  .nav-group{ display:flex; align-items:stretch; gap:4px; }
  .nav-group.left{ justify-content:flex-start; }
  .nav-group.right{ justify-content:flex-end; }
  .brand{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-decoration:none; justify-self:center; }
  .brand-word{ font-family:'Anton',sans-serif; font-size:26px; letter-spacing:0.02em; color:var(--near-black); line-height:1; transition:color .35s ease; }
  header.nav-scrolled .brand-word{ color:#fff; }
  .brand-underline{ width:34px; height:3px; background:var(--red); margin-top:6px; }
  nav.primary{ display:contents; }
  .nav-item{ position:relative; display:flex; height:100%; }
  .nav-item > a, .nav-item > button.nav-top{
    display:flex; align-items:center; gap:5px; background:none; border:none; cursor:pointer;
    color:var(--near-black); text-decoration:none; font-weight:700; font-size:12.5px; letter-spacing:0.05em; text-transform:uppercase;
    padding:0 15px; height:100%; font-family:'Archivo',sans-serif; transition:color .15s; position:relative;
  }
  header.nav-scrolled .nav-item > a, header.nav-scrolled .nav-item > button.nav-top{ color:#fff; }
  .nav-item > a:hover, .nav-item > button.nav-top:hover, .nav-item.open > button.nav-top{ color:var(--red); }
  .nav-item.active > a::after{ content:""; position:absolute; left:15px; right:15px; bottom:22px; height:3px; background:var(--red); }
  .nav-top .chev{ font-size:9px; transition:transform .15s; }
  .nav-item.open .chev{ transform:rotate(180deg); }
  .dropdown{ position:absolute; top:100%; left:0; min-width:220px; background:#fff; border-top:3px solid var(--red); box-shadow:0 14px 24px rgba(0,0,0,0.14); padding:8px 0; display:none; z-index:60; }
  .nav-item.open .dropdown{ display:block; }
  .dropdown a{ display:block; padding:11px 20px; text-decoration:none; color:var(--ink); font-size:13.5px; font-weight:600; text-transform:none; letter-spacing:0; }
  .dropdown a:hover{ background:var(--bg-raised); color:var(--red); }
  .nav-toggle{ display:none; background:none; border:1px solid var(--line); color:var(--ink); padding:8px 10px; font-size:20px; line-height:1; justify-self:end; align-self:center; transition:color .35s ease, border-color .35s ease; }
  header.nav-scrolled .nav-toggle{ color:#fff; border-color:rgba(255,255,255,0.35); }
  @media (max-width:940px){
    .topbar{ grid-template-columns:auto 1fr auto; }
    header{ padding-top:env(safe-area-inset-top,0px); padding-bottom:0; }
    .topbar{ border-radius:0; box-shadow:none; }
    .brand{ justify-self:start; align-items:flex-start; }
    nav.primary{ display:flex; position:fixed; inset:72px 0 0 0; background:#fff; flex-direction:column; gap:0; padding:8px 0 24px; transform:translateY(-8px); opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; overflow-y:auto; grid-column:1 / -1; border-top:1px solid var(--line); }
    nav.primary.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
    .nav-group{ display:contents; }
    .nav-item{ display:block; height:auto; border-bottom:1px solid var(--line); }
    .nav-item > a, .nav-item > button.nav-top{ height:auto; width:100%; padding:16px 24px; justify-content:space-between; }
    .nav-item.active > a::after{ display:none; }
    .dropdown{ position:static; box-shadow:none; border-top:none; background:var(--bg-raised); padding:0; }
    .dropdown a{ padding:12px 40px; border-top:1px solid var(--line); }
    .nav-toggle{ display:block; }
  }

  .page-head{ padding:40px 0 24px; border-bottom:1px solid var(--line); }
  .page-title{ font-size:clamp(30px,5vw,46px); text-transform:uppercase; }

  .ref-row{ display:grid; grid-template-columns:96px 1fr 150px; align-items:center; gap:24px; padding:24px 0; border-bottom:1px solid var(--line); }
  .photo-link{ display:block; text-decoration:none; }
  .avatar{ width:96px; height:96px; border-radius:50%; background:var(--near-black); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:28px; position:relative; overflow:hidden; transition:transform .15s; }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .avatar::after{ content:"View Profile"; position:absolute; inset:0; background:rgba(210,10,17,0.88); color:#fff; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; display:flex; align-items:center; justify-content:center; text-align:center; opacity:0; transition:opacity .15s; }
  .photo-link:hover .avatar::after{ opacity:1; }
  .photo-link:hover .avatar{ transform:scale(1.03); }
  .ref-main .nickname{ font-size:12px; font-style:italic; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.03em; }
  .ref-main .fname{ font-size:22px; font-weight:800; text-transform:uppercase; text-decoration:none; display:inline-block; margin:3px 0 4px; }
  .ref-main .fname:hover{ color:var(--red); }
  .ref-main .officiated{ font-size:13px; color:var(--ink-dim); font-weight:700; }
  .btn-outline{ justify-self:end; display:block; text-align:center; font-size:11.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; text-decoration:none; padding:11px 16px; border:1.5px solid var(--near-black); color:var(--near-black); white-space:nowrap; }
  .btn-outline:hover{ border-color:var(--red); color:var(--red); }

  @media (max-width:640px){
    .ref-row{ grid-template-columns:72px 1fr; grid-template-areas:"photo main" "photo action"; gap:8px 16px; }
    .avatar{ width:72px; height:72px; font-size:20px; }
    .photo-link{ grid-area:photo; } .ref-main{ grid-area:main; } .btn-outline{ grid-area:action; justify-self:start; }
  }

  footer{ padding:40px 0 calc(40px + env(safe-area-inset-bottom,0px)); background:var(--near-black); margin-top:20px; }
  .footer-row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; }
  .social-links{ display:flex; gap:22px; }
  .social-links a{ text-decoration:none; font-size:13px; font-weight:700; letter-spacing:0.04em; color:#b8b5af; }
  .social-links a:hover{ color:var(--red); }
  .footer-note{ font-size:12.5px; color:#7c7972; margin-top:18px; }
  footer .brand-word{ color:#fff; }

  .brand-logo{ height:34px; width:auto; display:block; transition:filter .35s ease; }
  header.nav-scrolled .brand-logo{ filter:brightness(0) invert(1); }
  @media (max-width:940px){ .brand-logo{ height:28px; } }

  /* ---------- nav bar animations (added) ---------- */
  .nav-item > a::after, .nav-item > button.nav-top::after{
    content:""; position:absolute; left:15px; right:15px; bottom:22px; height:3px; background:var(--red);
    transform:scaleX(0); transform-origin:left; transition:transform .28s cubic-bezier(.4,0,.2,1);
  }
  .nav-item:hover > a::after, .nav-item:hover > button.nav-top::after,
  .nav-item.active > a::after, .nav-item.active > button.nav-top::after{
    transform:scaleX(1);
  }
  .nav-item > a, .nav-item > button.nav-top{ transition:color .2s ease; }
  .nav-top .chev{ transition:transform .22s ease; }

  .dropdown{
    display:block; margin:0; opacity:0; visibility:hidden; pointer-events:none;
    transform:translateY(-8px) scale(0.98); transform-origin:top center;
    transition:opacity .2s ease, transform .2s cubic-bezier(.2,.8,.3,1.1), visibility .2s;
  }
  .nav-item.open .dropdown{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0) scale(1); }
  .dropdown a{ transition:background .15s ease, color .15s ease, padding-left .15s ease; }
  .dropdown a:hover{ padding-left:24px; }

  .nav-toggle{ transition:transform .25s cubic-bezier(.4,0,.2,1), color .2s ease, border-color .2s ease; }
  .nav-toggle.is-open{ transform:rotate(90deg); color:var(--red); border-color:var(--red); }

  .brand-logo{ transition:transform .25s cubic-bezier(.4,0,.2,1); }
  .brand:hover .brand-logo{ transform:scale(1.06); }

  @media (max-width:940px){
    .nav-item > a::after, .nav-item > button.nav-top::after{ display:none; }
    .dropdown{ display:none; opacity:1; visibility:visible; pointer-events:auto; transform:none; }
    .nav-item.open .dropdown{ display:block; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap topbar">
    <nav class="primary" id="primaryNav">
      <div class="nav-group left">
        <div class="nav-item"><a href="schedule.html">Events</a></div>
        <div class="nav-item"><a href="rankings.html">Rankings</a></div>
        <div class="nav-item"><a href="fighters.html">Athletes</a></div>
      </div>
      <a class="brand" href="index.html"><img src="nfc-logo.png" alt="NFC" class="brand-logo"></a>
      <div class="nav-group right">
        <div class="nav-item"><a href="rules.html">Rules</a></div>
        <div class="nav-item active"><a href="referees.html">Referees</a></div>
        <div class="nav-item">
          <button class="nav-top" data-dd="connect">Connect <span class="chev">▾</span></button>
          <div class="dropdown">
            <a id="ddYoutube" href="#" target="_blank" rel="noopener">YouTube</a>
            <a id="ddTiktok" href="#" target="_blank" rel="noopener">TikTok</a>
            <a id="ddInstagram" href="#" target="_blank" rel="noopener">Instagram</a>
          </div>
        </div>
      </div>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <h1 class="page-title display">Referees</h1>
    </div>
    <div id="refList"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="footer-row">
      <div class="brand-word display" style="font-size:20px;">NFC</div>
      <div class="social-links">
        <a id="socialYoutube" href="#" target="_blank" rel="noopener">YOUTUBE</a>
        <a id="socialTiktok" href="#" target="_blank" rel="noopener">TIKTOK</a>
        <a id="socialInstagram" href="#" target="_blank" rel="noopener">INSTAGRAM</a>
      </div>
    </div>
    <div class="footer-note">Contact the Commissioner for any questions.</div>
  </div>
</footer>

<script>
  
  // Scroll-reactive nav bar: compact + white near the top, expands + darkens once you scroll down.
  (function(){
    var hdr = document.querySelector('header');
    if(!hdr) return;
    var THRESHOLD = 40;
    function onScroll(){
      if(window.scrollY > THRESHOLD){ hdr.classList.add('nav-scrolled'); }
      else{ hdr.classList.remove('nav-scrolled'); }
    }
    onScroll();
    window.addEventListener('scroll', onScroll, { passive:true });
  })();

  document.getElementById('navToggle').addEventListener('click', function(){
    document.getElementById('primaryNav').classList.toggle('open');
    this.classList.toggle('is-open');
  });
  document.querySelectorAll('.nav-top').forEach(function(btn){
    btn.addEventListener('click', function(){
      const item = btn.closest('.nav-item');
      const wasOpen = item.classList.contains('open');
      document.querySelectorAll('.nav-item.open').forEach(i=>i.classList.remove('open'));
      if(!wasOpen) item.classList.add('open');
    });
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('.nav-item')){
      document.querySelectorAll('.nav-item.open').forEach(i=>i.classList.remove('open'));
    }
  });
  ['socialYoutube','ddYoutube'].forEach(id=>document.getElementById(id).href = NFC_SOCIALS.youtube);
  ['socialTiktok','ddTiktok'].forEach(id=>document.getElementById(id).href = NFC_SOCIALS.tiktok);
  ['socialInstagram','ddInstagram'].forEach(id=>document.getElementById(id).href = NFC_SOCIALS.instagram);

  function initials(name){ return name.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase(); }
  const listEl = document.getElementById('refList');
  REFEREES.forEach(r=>{
    const row = document.createElement('div');
    row.className = 'ref-row';
    row.innerHTML = `
      <a class="photo-link" href="${r.slug}.html"><div class="avatar">${r.photo ? `<img src="${r.photo}" alt="${r.name}">` : initials(r.name)}</div></a>
      <div class="ref-main">
        <div class="nickname">"${r.nickname}"</div>
        <a class="fname display" href="${r.slug}.html">${r.name}</a>
        <div class="officiated">Fights Officiated: ${r.officiated}</div>
      </div>
      <a class="btn-outline" href="${r.slug}.html">View Profile</a>
    `;
    listEl.appendChild(row);
  });
</script>

</body>
</html>
