<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fighters — NFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script>
/* ==========================================================================
   EDITABLE ROSTER DATA — add a fighter to the FIGHTERS array to add them
   to the site. "lastFight" is shown as-is; leave it as "Awaiting Debut"
   for a fighter with no fights yet.
   ========================================================================== */
const FIGHTERS = [
  { name:"Beckham Kyling", slug:"beckham-kyling", nickname:"Monkler", division:"Lightweight", weightClass:"158 lb", record:"3-0-0", lastFight:"Beckham Kyling vs Stephen Grove" },
  { name:"Stephen Grove", slug:"stephen-grove", nickname:"Teve", division:"Lightweight", weightClass:"158 lb", record:"1-2-0", lastFight:"Beckham Kyling vs Stephen Grove" },
  { name:"Sebastian Morales", slug:"sebastian-morales", nickname:"Fish", division:"Lightweight", weightClass:"158 lb", record:"0-0-0", lastFight:"Awaiting Debut" },
  { name:"Ryan Long", slug:"ryan-long", nickname:"Le Boss", division:"Lightweight", weightClass:"158 lb", record:"0-1-0", lastFight:"Max Klein vs Ryan Long" },
  { name:"Thomas Strand", slug:"thomas-strand", nickname:"Chop", division:"Lightweight", weightClass:"158 lb", record:"2-0-0", lastFight:"Thomas Strand vs Ryan Ninemire" },
  { name:"Ryan Ninemire", slug:"ryan-ninemire", nickname:"Mookie", division:"Lightweight", weightClass:"158 lb", record:"0-3-0", lastFight:"Thomas Strand vs Ryan Ninemire" },
  { name:"Thomas Thornton", slug:"thomas-thornton", nickname:"Thornsy", division:"Lightweight", weightClass:"158 lb", record:"0-0-0", lastFight:"Awaiting Debut" },
  { name:"Max Klein", slug:"max-klein", nickname:"The Jew", division:"Lightweight", weightClass:"158 lb", record:"1-1-0", lastFight:"Max Klein vs Ryan Long" },
  { name:"Joey Rampolla", slug:"joey-rampolla", nickname:"The Geeked", division:"Lightweight", weightClass:"158 lb", record:"0-0-0", lastFight:"Awaiting Debut" },
  { name:"Landon Wilson", slug:"landon-wilson", nickname:"The Great", division:"Lightweight", weightClass:"158 lb", record:"0-1-0", lastFight:"Beckham Kyling vs Landon Wilson" },
  { name:"Austin Frie", slug:"austin-frie", nickname:"Natty Champ", division:"Middleweight", weightClass:"185 lb", record:"1-0-0", lastFight:"Austin Frie vs Nathan Upvall" },
  { name:"Kon Tselios", slug:"kon-tselios", nickname:"Tripod", division:"Middleweight", weightClass:"185 lb", record:"2-0-0", lastFight:"Kon Tselios vs Nathan Upvall" },
  { name:"Nathan Upvall", slug:"nathan-upvall", nickname:"Nart", division:"Middleweight", weightClass:"185 lb", record:"0-2-0", lastFight:"Austin Frie vs Nathan Upvall" },
  { name:"Zach Polkes", slug:"zach-polkes", nickname:"Polksey", division:"Middleweight", weightClass:"185 lb", record:"0-0-0", lastFight:"Awaiting Debut" }
];
const NFC_SOCIALS = {
  youtube: "https://www.youtube.com/playlist?list=PLOVVnXw7vnioi8JdVCJgEnHuXR89VmVWb",
  tiktok: "https://www.tiktok.com/@nfc.com1",
  instagram: "https://www.instagram.com/nfc.com1/"
};
</script>
<style>
  :root{
    --bg:#ffffff; --bg-raised:#f4f3f1; --line:#e2e0da; --ink:#111111; --ink-dim:#68655f;
    --red:#d20a11; --brass:#8a6a1f; --near-black:#111111; box-sizing:border-box;
  }
  *,*::before,*::after{ box-sizing:inherit; }
  html{ scroll-padding-top: env(safe-area-inset-top,0px); }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Archivo',system-ui,sans-serif; padding-top:env(safe-area-inset-top,0px); -webkit-font-smoothing:antialiased; padding-bottom:64px; }
  .display{ font-family:'Anton',Impact,sans-serif; font-weight:400; letter-spacing:0.01em; line-height:0.92; }
  a{ color:inherit; }
  .wrap{ max-width:1240px; margin:0 auto; padding:0 24px; }
  button{ font-family:inherit; }

  header{ position:sticky; top:0; z-index:50; background:#fff; border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px); }
  .topbar{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; height:72px; }
  .nav-group{ display:flex; align-items:stretch; gap:4px; }
  .nav-group.left{ justify-content:flex-start; }
  .nav-group.right{ justify-content:flex-end; }
  .brand{ display:flex; flex-direction:column; align-items:center; text-decoration:none; justify-self:center; }
  .brand-word{ font-family:'Anton',sans-serif; font-size:26px; letter-spacing:0.02em; color:var(--near-black); line-height:1; }
  .brand-underline{ width:34px; height:3px; background:var(--red); margin-top:6px; }
  nav.primary{ display:contents; }
  .nav-item{ position:relative; display:flex; }
  .nav-item > a, .nav-item > button.nav-top{
    display:flex; align-items:center; gap:5px; background:none; border:none; cursor:pointer;
    color:var(--near-black); text-decoration:none; font-weight:700; font-size:12.5px; letter-spacing:0.05em; text-transform:uppercase;
    padding:0 15px; height:72px; font-family:'Archivo',sans-serif; transition:color .15s; position:relative;
  }
  .nav-item > a:hover, .nav-item > button.nav-top:hover, .nav-item.open > button.nav-top{ color:var(--red); }
  .nav-item.active > a::after, .nav-item.active > button::after{ content:""; position:absolute; left:15px; right:15px; bottom:22px; height:3px; background:var(--red); }
  .nav-top .chev{ font-size:9px; transition:transform .15s; }
  .nav-item.open .chev{ transform:rotate(180deg); }
  .dropdown{ position:absolute; top:72px; left:0; min-width:220px; background:#fff; border-top:3px solid var(--red); box-shadow:0 14px 24px rgba(0,0,0,0.14); padding:8px 0; display:none; z-index:60; }
  .nav-item.open .dropdown{ display:block; }
  .dropdown a{ display:block; padding:11px 20px; text-decoration:none; color:var(--ink); font-size:13.5px; font-weight:600; text-transform:none; letter-spacing:0; }
  .dropdown a:hover{ background:var(--bg-raised); color:var(--red); }
  .nav-toggle{ display:none; background:none; border:1px solid var(--line); color:var(--ink); padding:8px 10px; font-size:20px; line-height:1; justify-self:end; }
  @media (max-width:940px){
    .topbar{ grid-template-columns:auto 1fr auto; }
    .brand{ justify-self:start; align-items:flex-start; }
    nav.primary{ display:flex; position:fixed; inset:72px 0 0 0; background:#fff; flex-direction:column; gap:0; padding:8px 0 24px; transform:translateY(-8px); opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; overflow-y:auto; grid-column:1 / -1; border-top:1px solid var(--line); }
    nav.primary.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
    .nav-group{ display:contents; }
    .nav-item{ display:block; border-bottom:1px solid var(--line); }
    .nav-item > a, .nav-item > button.nav-top{ height:auto; width:100%; padding:16px 24px; justify-content:space-between; }
    .nav-item.active > a::after{ display:none; }
    .dropdown{ position:static; box-shadow:none; border-top:none; background:var(--bg-raised); padding:0; }
    .dropdown a{ padding:12px 40px; border-top:1px solid var(--line); }
    .nav-toggle{ display:block; }
  }

  .page-head{ padding:40px 0 24px; border-bottom:1px solid var(--line); }
  .page-title{ font-size:clamp(30px,5vw,46px); text-transform:uppercase; }
  .page-sub{ font-size:14px; color:var(--ink-dim); margin-top:8px; }

  .division-heading{ padding:36px 0 4px; font-size:13px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--red); }

  .fighter-row{ display:grid; grid-template-columns:150px 96px 1fr 150px; align-items:center; gap:24px; padding:22px 0; border-bottom:1px solid var(--line); }
  .row-division{ font-size:12px; color:var(--ink-dim); }
  .row-division b{ display:block; color:var(--ink); font-weight:800; text-transform:uppercase; font-size:13px; margin-bottom:2px; }

  .photo-link{ display:block; text-decoration:none; }
  .avatar{
    width:96px; height:96px; border-radius:50%; background:var(--near-black); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:28px;
    transition:transform .15s, background .15s; position:relative; overflow:hidden;
  }
  .avatar::after{ content:"View Profile"; position:absolute; inset:0; background:rgba(210,10,17,0.88); color:#fff; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; display:flex; align-items:center; justify-content:center; text-align:center; opacity:0; transition:opacity .15s; }
  .photo-link:hover .avatar::after{ opacity:1; }
  .photo-link:hover .avatar{ transform:scale(1.03); }

  .row-main .nickname{ font-size:12px; font-style:italic; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.03em; }
  .row-main .fname{ font-size:22px; font-weight:800; text-transform:uppercase; text-decoration:none; display:inline-block; margin:3px 0 4px; }
  .row-main .fname:hover{ color:var(--red); }
  .row-main .record{ font-size:13px; color:var(--ink-dim); font-weight:700; margin-bottom:4px; }
  .row-main .last-fight{ font-size:12.5px; color:var(--ink-dim); }
  .row-main .last-fight b{ color:var(--ink); font-weight:700; }

  .row-action{ justify-self:end; }
  .btn-outline{ display:block; text-align:center; font-size:11.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; text-decoration:none; padding:11px 16px; border:1.5px solid var(--near-black); color:var(--near-black); white-space:nowrap; }
  .btn-outline:hover{ border-color:var(--red); color:var(--red); }

  @media (max-width:760px){
    .fighter-row{ grid-template-columns:72px 1fr; grid-template-areas:"photo main" "photo action"; gap:8px 16px; }
    .avatar{ width:72px; height:72px; font-size:20px; }
    .row-division{ display:none; }
    .photo-link{ grid-area:photo; }
    .row-main{ grid-area:main; }
    .row-action{ grid-area:action; justify-self:start; }
    .btn-outline{ padding:9px 14px; }
  }

  footer{ padding:40px 0 calc(40px + env(safe-area-inset-bottom,0px)); background:var(--near-black); margin-top:20px; }
  .footer-row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; }
  .social-links{ display:flex; gap:22px; }
  .social-links a{ text-decoration:none; font-size:13px; font-weight:700; letter-spacing:0.04em; color:#b8b5af; }
  .social-links a:hover{ color:var(--red); }
  .footer-note{ font-size:12.5px; color:#7c7972; margin-top:18px; }
  footer .brand-word{ color:#fff; }
</style>
</head>
<body>

<header>
  <div class="wrap topbar">
    <nav class="primary" id="primaryNav">
      <div class="nav-group left">
        <div class="nav-item"><a href="schedule.html">Events</a></div>
        <div class="nav-item"><a href="rankings.html">Rankings</a></div>
        <div class="nav-item active"><a href="fighters.html">Fighters</a></div>
      </div>
      <a class="brand" href="index.html">
        <span class="brand-word">NFC</span>
        <span class="brand-underline"></span>
      </a>
      <div class="nav-group right">
        <div class="nav-item"><a href="rules.html">Rules</a></div>
        <div class="nav-item"><a href="referees.html">Referees</a></div>
        <div class="nav-item">
          <button class="nav-top" data-dd="connect">Connect <span class="chev">▾</span></button>
          <div class="dropdown">
            <a id="ddYoutube" href="#" target="_blank" rel="noopener">YouTube</a>
            <a id="ddTiktok" href="#" target="_blank" rel="noopener">TikTok</a>
            <a id="ddInstagram" href="#" target="_blank" rel="noopener">Instagram</a>
          </div>
        </div>
      </div>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <h1 class="page-title display">Fighters</h1>
      <p class="page-sub">The full NFC roster. Tap a fighter's photo for their full profile and fight history.</p>
    </div>
    <div id="rosterList"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="footer-row">
      <div class="brand-word display" style="font-size:20px;">NFC</div>
      <div class="social-links">
        <a id="socialYoutube" href="#" target="_blank" rel="noopener">YOUTUBE</a>
        <a id="socialTiktok" href="#" target="_blank" rel="noopener">TIKTOK</a>
        <a id="socialInstagram" href="#" target="_blank" rel="noopener">INSTAGRAM</a>
      </div>
    </div>
    <div class="footer-note">Contact the Commissioner for any questions.</div>
  </div>
</footer>

<script>
  document.getElementById('navToggle').addEventListener('click', function(){
    document.getElementById('primaryNav').classList.toggle('open');
  });
  document.querySelectorAll('.nav-top').forEach(function(btn){
    btn.addEventListener('click', function(){
      const item = btn.closest('.nav-item');
      const wasOpen = item.classList.contains('open');
      document.querySelectorAll('.nav-item.open').forEach(i=>i.classList.remove('open'));
      if(!wasOpen) item.classList.add('open');
    });
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('.nav-item')){
      document.querySelectorAll('.nav-item.open').forEach(i=>i.classList.remove('open'));
    }
  });
  ['socialYoutube','ddYoutube'].forEach(id=>document.getElementById(id).href = NFC_SOCIALS.youtube);
  ['socialTiktok','ddTiktok'].forEach(id=>document.getElementById(id).href = NFC_SOCIALS.tiktok);
  ['socialInstagram','ddInstagram'].forEach(id=>document.getElementById(id).href = NFC_SOCIALS.instagram);

  function initials(name){ return name.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase(); }

  const listEl = document.getElementById('rosterList');
  let currentDivision = null;

  FIGHTERS.forEach(f=>{
    if(f.division !== currentDivision){
      currentDivision = f.division;
      const h = document.createElement('div');
      h.className = 'division-heading';
      h.textContent = currentDivision + ' — ' + f.weightClass;
      listEl.appendChild(h);
    }
    const row = document.createElement('div');
    row.className = 'fighter-row';
    row.innerHTML = `
      <div class="row-division"><b>${f.division}</b>${f.weightClass}</div>
      <a class="photo-link" href="fighters/${f.slug}.html">
        <div class="avatar">${initials(f.name)}</div>
      </a>
      <div class="row-main">
        <div class="nickname">"${f.nickname}"</div>
        <a class="fname display" href="fighters/${f.slug}.html">${f.name}</a>
        <div class="record">${f.record} [W-L-D]</div>
        <div class="last-fight"><b>Last Fight:</b> ${f.lastFight}</div>
      </div>
      <div class="row-action">
        <a class="btn-outline" href="fighters/${f.slug}.html">View Profile</a>
      </div>
    `;
    listEl.appendChild(row);
  });
</script>

</body>
</html>
