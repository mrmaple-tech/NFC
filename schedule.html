<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule — NFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script>
/* ==========================================================================

   array each week. Each event can have one or more bouts. Use "TBD" for
   method/round/time on a bout that hasn't happened yet.
   ========================================================================== */
const EVENTS = [
  {
    number: "NFC 7",
    date: "Postponed — New Date TBD",
    bouts: [
      { weightClass: "Vacant Lightweight Title", a:{name:"Beckham Kyling",slug:"beckham-kyling",record:"3-0-0"}, b:{name:"Thomas Strand",slug:"thomas-strand",record:"2-0-0"}, result:"pending", postponed:true }
    ]
  },
  {
    number: "NFC 6",
    date: "August 15, 2026",
    bouts: [
      { weightClass: "Middleweight", a:{name:"Austin Frie",slug:"austin-frie"}, b:{name:"Nathan Upvall",slug:"nathan-upvall"}, winner:"a", method:"Decision · Unanimous", round:"3", time:"2:00" },
      { weightClass: "Lightweight", a:{name:"Beckham Kyling",slug:"beckham-kyling"}, b:{name:"Stephen Grove",slug:"stephen-grove"}, winner:"a", method:"Decision · Split", round:"3", time:"2:00" },
      { weightClass: "Lightweight", a:{name:"Max Klein",slug:"max-klein"}, b:{name:"Ryan Long",slug:"ryan-long"}, winner:"a", method:"Decision · Unanimous", round:"3", time:"2:00" }
    ]
  },
  {
    number: "NFC 5",
    date: "June 25, 2026",
    bouts: [
      { weightClass: "Lightweight", a:{name:"Thomas Strand",slug:"thomas-strand"}, b:{name:"Ryan Ninemire",slug:"ryan-ninemire"}, winner:"a", method:"Submission · Rear-Naked Choke", round:"2", time:"1:02" }
    ]
  },
  {
    number: "NFC 4",
    date: "June 12, 2026",
    bouts: [
      { weightClass: "Lightweight", a:{name:"Beckham Kyling",slug:"beckham-kyling"}, b:{name:"Landon Wilson",slug:"landon-wilson"}, winner:"a", method:"Submission · Guillotine", round:"1", time:"0:13" }
    ]
  },
  {
    number: "NFC 3",
    date: "June 2, 2026",
    bouts: [
      { weightClass: "Middleweight Championship", a:{name:"Kon Tselios",slug:"kon-tselios"}, b:{name:"Nathan Upvall",slug:"nathan-upvall"}, winner:"a", method:"Submission · Rear-Naked Choke", round:"1", time:"1:43" },
      { weightClass: "Lightweight", a:{name:"Stephen Grove",slug:"stephen-grove"}, b:{name:"Ryan Ninemire",slug:"ryan-ninemire"}, winner:"a", method:"Submission · Rear-Naked Choke", round:"1", time:"1:35" }
    ]
  },
  {
    number: "NFC 2",
    date: "May 24, 2026",
    bouts: [
      { weightClass: "Lightweight", a:{name:"Thomas Strand",slug:"thomas-strand"}, b:{name:"Max Klein",slug:"max-klein"}, winner:"a", method:"Submission · Guillotine", round:"2", time:"1:04" }
    ]
  },
  {
    number: "NFC 1",
    date: "May 9, 2026",
    bouts: [
      { weightClass: "Lightweight", a:{name:"Beckham Kyling",slug:"beckham-kyling"}, b:{name:"Ryan Ninemire",slug:"ryan-ninemire"}, winner:"a", method:"Submission · Rear-Naked Choke", round:"2", time:"0:22" },
      { weightClass: "Catchweight", a:{name:"Kon Tselios",slug:"kon-tselios"}, b:{name:"Stephen Grove",slug:"stephen-grove"}, winner:"a", method:"Submission · Arm Triangle", round:"2", time:"0:47" }

/* ========================================================================== */

const NFC_SOCIALS = {
  youtube: "https://www.youtube.com/playlist?list=PLOVVnXw7vnioi8JdVCJgEnHuXR89VmVWb",
  tiktok: "https://www.tiktok.com/@nfc.com1",
  instagram: "https://www.instagram.com/nfc.com1/"
};
</script>
<style>
  :root{
    --bg:#ffffff; --bg-raised:#f4f3f1; --line:#e2e0da; --ink:#111111; --ink-dim:#68655f;
    --red:#d20a11; --brass:#8a6a1f; --near-black:#111111; box-sizing:border-box;
  }
  *,*::before,*::after{ box-sizing:inherit; }
  html{ scroll-padding-top: env(safe-area-inset-top,0px); overflow-x:hidden; max-width:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Archivo',system-ui,sans-serif; padding-top:env(safe-area-inset-top,0px); -webkit-font-smoothing:antialiased; }
  .display{ font-family:'Anton',Impact,sans-serif; font-weight:400; letter-spacing:0.01em; line-height:0.92; }
  a{ color:inherit; }
  .wrap{ max-width:1240px; margin:0 auto; padding:0 24px; }
  button{ font-family:inherit; }

  /* ---------- header (shared) ---------- */
  header{ position:sticky; top:0; z-index:50; background:var(--bg-raised); border-bottom:1px solid transparent; padding-top:calc(env(safe-area-inset-top,0px) + 12px); padding-bottom:12px; transition:background .35s ease, border-color .35s ease, box-shadow .35s ease, padding .35s ease; }
  header.nav-scrolled{ background:var(--near-black); border-bottom-color:var(--near-black); box-shadow:0 8px 22px rgba(0,0,0,0.28); padding-top:env(safe-area-inset-top,0px); padding-bottom:0; }
  .topbar{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; height:56px; background:#fff; border-radius:14px; box-shadow:0 3px 16px rgba(17,17,17,0.10); transition:height .35s ease, border-radius .35s ease, box-shadow .35s ease, background .35s ease;}
  header.nav-scrolled .topbar{ height:76px; border-radius:0; box-shadow:none; background:transparent; }
  .nav-group{ display:flex; align-items:stretch; gap:4px; }
  .nav-group.left{ justify-content:flex-start; }
  .nav-group.right{ justify-content:flex-end; }
  .brand{ display:flex; flex-direction:column; align-items:center; text-decoration:none; justify-self:center; }
  .brand-word{ font-family:'Anton',sans-serif; font-size:26px; letter-spacing:0.02em; color:var(--near-black); line-height:1; transition:color .35s ease; }
  header.nav-scrolled .brand-word{ color:#fff; }
  .brand-underline{ width:34px; height:3px; background:var(--red); margin-top:6px; }
  nav.primary{ display:contents; }
  .nav-item{ position:relative; display:flex; }
  .nav-item > a, .nav-item > button.nav-top{
    display:flex; align-items:center; gap:5px; background:none; border:none; cursor:pointer;
    color:var(--near-black); text-decoration:none; font-weight:700; font-size:12.5px; letter-spacing:0.05em; text-transform:uppercase;
    padding:0 15px; height:72px; font-family:'Archivo',sans-serif; transition:color .15s; position:relative;
  }
  header.nav-scrolled .nav-item > a, header.nav-scrolled .nav-item > button.nav-top{ color:#fff; }
  .nav-item > a:hover, .nav-item > button.nav-top:hover, .nav-item.open > button.nav-top{ color:var(--red); }
  .nav-item.active > a::after{ content:""; position:absolute; left:15px; right:15px; bottom:22px; height:3px; background:var(--red); }
  .nav-top .chev{ font-size:9px; transition:transform .15s; }
  .nav-item.open .chev{ transform:rotate(180deg); }
  .dropdown{ position:absolute; top:72px; left:0; min-width:220px; background:#fff; border-top:3px solid var(--red); box-shadow:0 14px 24px rgba(0,0,0,0.14); padding:8px 0; display:none; z-index:60; }
  .nav-item.open .dropdown{ display:block; }
  .dropdown a{ display:block; padding:11px 20px; text-decoration:none; color:var(--ink); font-size:13.5px; font-weight:600; text-transform:none; letter-spacing:0; }
  .dropdown a:hover{ background:var(--bg-raised); color:var(--red); }
  .nav-toggle{ display:none; background:none; border:1px solid var(--line); color:var(--ink); padding:8px 10px; font-size:20px; line-height:1; justify-self:end; transition:color .35s ease, border-color .35s ease; }
  header.nav-scrolled .nav-toggle{ color:#fff; border-color:rgba(255,255,255,0.35); }
  @media (max-width:940px){
    .topbar{ grid-template-columns:auto 1fr auto; }
    header{ padding-top:env(safe-area-inset-top,0px); padding-bottom:0; }
    .topbar{ border-radius:0; box-shadow:none; }
    .brand{ justify-self:start; align-items:flex-start; }
    nav.primary{ display:flex; position:fixed; inset:72px 0 0 0; background:#fff; flex-direction:column; gap:0; padding:8px 0 24px; transform:translateY(-8px); opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; overflow-y:auto; grid-column:1 / -1; border-top:1px solid var(--line); }
    nav.primary.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
    .nav-group{ display:contents; }
    .nav-item{ display:block; border-bottom:1px solid var(--line); }
    .nav-item > a, .nav-item > button.nav-top{ height:auto; width:100%; padding:16px 24px; justify-content:space-between; }
    .nav-item.active > a::after{ display:none; }
    .dropdown{ position:static; box-shadow:none; border-top:none; background:var(--bg-raised); padding:0; }
    .dropdown a{ padding:12px 40px; border-top:1px solid var(--line); }
    .nav-toggle{ display:block; }
  }

  /* ---------- page head ---------- */
  .page-head{ padding:40px 0 24px; border-bottom:1px solid var(--line); }
  .page-title{ font-size:clamp(30px,5vw,46px); text-transform:uppercase; }
  .page-sub{ font-size:14px; color:var(--ink-dim); margin-top:8px; }

  /* ---------- event rows ---------- */
  .event-row{ display:grid; grid-template-columns:140px 1fr 260px 150px; gap:24px; align-items:center; padding:36px 0; border-bottom:1px solid var(--line); }
  .event-logo{ line-height:1; }
  .event-logo .brand-word{ font-size:22px; }
  .event-logo .elogo-num{ font-family:'Anton',sans-serif; font-size:44px; color:var(--near-black); margin-top:2px; }
  .event-logo .elogo-date{ font-size:11.5px; color:var(--ink-dim); font-weight:700; margin-top:6px; }

  .fight-carousel{ display:flex; align-items:center; gap:14px; }
  .arrow{ flex:none; width:36px; height:36px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:16px; color:var(--ink); display:flex; align-items:center; justify-content:center; transition:border-color .15s, color .15s; }
  .arrow:hover{ border-color:var(--red); color:var(--red); }
  .arrow[disabled]{ opacity:0.3; cursor:default; pointer-events:none; }
  .fight-slide{ flex:1; display:flex; align-items:center; justify-content:center; gap:18px; min-width:0; }
  .vs-fighter{ display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0; }
  .vs-avatar{ width:56px; height:56px; border-radius:50%; background:var(--near-black); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:18px; flex:none; overflow:hidden; }
  .vs-avatar img{ width:100%; height:100%; object-fit:cover; }
  .vs-fighter.winner .vs-avatar{ background:var(--red); }
  .vs-fname{ font-size:15px; font-weight:700; text-align:center; white-space:nowrap; }
  .vs-result{ font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-dim); font-weight:700; }
  .vs-fighter.winner .vs-result{ color:var(--red); }
  .vs-divider{ font-family:'Anton',sans-serif; color:var(--brass); font-size:14px; flex:none; }

  .event-info{ min-width:0; }
  .info-title{ font-size:18px; font-weight:800; text-transform:uppercase; margin-bottom:6px; }
  .info-line{ font-size:12.5px; color:var(--ink-dim); line-height:1.6; }
  .info-line b{ color:var(--ink); }
  .date-line{ font-size:12px; font-weight:700; color:var(--ink); letter-spacing:0.01em; }

  .event-actions{ display:flex; flex-direction:column; gap:10px; }
  .btn-outline{ display:block; text-align:center; font-size:11.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; text-decoration:none; padding:11px 12px; border:1.5px solid var(--near-black); color:var(--near-black); }
  .btn-outline:hover{ border-color:var(--red); color:var(--red); }

  @media (max-width:860px){
    .event-row{ grid-template-columns:minmax(0,1fr); gap:14px; padding:28px 0; }
    .fight-carousel, .fight-slide, .vs-fighter{ min-width:0; }
    .vs-fname{ white-space:normal; }
    .event-actions{ flex-direction:row; }
    .fight-slide{ justify-content:flex-start; overflow-x:auto; }
  }

  /* ---------- footer ---------- */
  footer{ padding:40px 0 calc(40px + env(safe-area-inset-bottom,0px)); background:var(--near-black); margin-top:20px; }
  .footer-row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; }
  .social-links{ display:flex; gap:22px; }
  .social-links a{ text-decoration:none; font-size:13px; font-weight:700; letter-spacing:0.04em; color:#b8b5af; }
  .social-links a:hover{ color:var(--red); }
  .footer-note{ font-size:12.5px; color:#7c7972; margin-top:18px; }
  footer .brand-word{ color:#fff; }


  .brand-logo{ height:34px; width:auto; display:block; transition:filter .35s ease; }
  header.nav-scrolled .brand-logo{ filter:brightness(0) invert(1); }
  @media (max-width:940px){ .brand-logo{ height:28px; } }

  /* ---------- nav bar animations (added) ---------- */
  .nav-item > a::after, .nav-item > button.nav-top::after{
    content:""; position:absolute; left:15px; right:15px; bottom:22px; height:3px; background:var(--red);
    transform:scaleX(0); transform-origin:left; transition:transform .28s cubic-bezier(.4,0,.2,1);
  }
  .nav-item:hover > a::after, .nav-item:hover > button.nav-top::after,
  .nav-item.active > a::after, .nav-item.active > button.nav-top::after{
    transform:scaleX(1);
  }
  .nav-item > a, .nav-item > button.nav-top{ transition:color .2s ease; }
  .nav-top .chev{ transition:transform .22s ease; }

  .dropdown{
    display:block; margin:0; opacity:0; visibility:hidden; pointer-events:none;
    transform:translateY(-8px) scale(0.98); transform-origin:top center;
    transition:opacity .2s ease, transform .2s cubic-bezier(.2,.8,.3,1.1), visibility .2s;
  }
  .nav-item.open .dropdown{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0) scale(1); }
  .dropdown a{ transition:background .15s ease, color .15s ease, padding-left .15s ease; }
  .dropdown a:hover{ padding-left:24px; }

  .nav-toggle{ transition:transform .25s cubic-bezier(.4,0,.2,1), color .2s ease, border-color .2s ease; }
  .nav-toggle.is-open{ transform:rotate(90deg); color:var(--red); border-color:var(--red); }

  .brand-logo{ transition:transform .25s cubic-bezier(.4,0,.2,1); }
  .brand:hover .brand-logo{ transform:scale(1.06); }

  @media (max-width:940px){
    .nav-item > a::after, .nav-item > button.nav-top::after{ display:none; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap topbar">
    <nav class="primary" id="primaryNav">
      <div class="nav-group left">
        <div class="nav-item active"><a href="schedule.html">Events</a></div>
        <div class="nav-item"><a href="rankings.html">Rankings</a></div>
        <div class="nav-item">
          <button class="nav-top" data-dd="fighters">Athletes <span class="chev">▾</span></button>
          <div class="dropdown">
            <a href="fighters.html">Full Roster</a>
            <a href="fighters.html#lightweight">Lightweight</a>
            <a href="fighters.html#middleweight">Middleweight</a>
          </div>
        </div>
      </div>
      <a class="brand" href="index.html"><img src="nfc-logo.png" alt="NFC" class="brand-logo"></a>
      <div class="nav-group right">
        <div class="nav-item"><a href="rules.html">Rules</a></div>
        <div class="nav-item"><a href="referees.html">Referees</a></div>
        <div class="nav-item">
          <button class="nav-top" data-dd="connect">Connect <span class="chev">▾</span></button>
          <div class="dropdown">
            <a id="ddYoutube" href="#" target="_blank" rel="noopener">YouTube</a>
            <a id="ddTiktok" href="#" target="_blank" rel="noopener">TikTok</a>
            <a id="ddInstagram" href="#" target="_blank" rel="noopener">Instagram</a>
          </div>
        </div>
      </div>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <h1 class="page-title display">Schedule</h1>
      <p class="page-sub">Every NFC event, oldest bout on each card first. Use the arrows to browse a full fight card.</p>
    </div>
    <div id="eventList"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="footer-row">
      <div class="brand-word display" style="font-size:20px;">NFC</div>
      <div class="social-links">
        <a id="socialYoutube" href="#" target="_blank" rel="noopener">YOUTUBE</a>
        <a id="socialTiktok" href="#" target="_blank" rel="noopener">TIKTOK</a>
        <a id="socialInstagram" href="#" target="_blank" rel="noopener">INSTAGRAM</a>
      </div>
    </div>
    <div class="footer-note">Contact the Commissioner for any questions.</div>
  </div>
</footer>

<script>
  
  // Scroll-reactive nav bar: compact + white near the top, expands + darkens once you scroll down.
  (function(){
    var hdr = document.querySelector('header');
    if(!hdr) return;
    var THRESHOLD = 40;
    function onScroll(){
      if(window.scrollY > THRESHOLD){ hdr.classList.add('nav-scrolled'); }
      else{ hdr.classList.remove('nav-scrolled'); }
    }
    onScroll();
    window.addEventListener('scroll', onScroll, { passive:true });
  })();

  document.getElementById('navToggle').addEventListener('click', function(){
    document.getElementById('primaryNav').classList.toggle('open');
    this.classList.toggle('is-open');
  });
  document.querySelectorAll('.nav-top').forEach(function(btn){
    btn.addEventListener('click', function(){
      const item = btn.closest('.nav-item');
      const wasOpen = item.classList.contains('open');
      document.querySelectorAll('.nav-item.open').forEach(i=>i.classList.remove('open'));
      if(!wasOpen) item.classList.add('open');
    });
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('.nav-item')){
      document.querySelectorAll('.nav-item.open').forEach(i=>i.classList.remove('open'));
    }
  });
  ['socialYoutube','ddYoutube'].forEach(id=>document.getElementById(id).href = NFC_SOCIALS.youtube);
  ['socialTiktok','ddTiktok'].forEach(id=>document.getElementById(id).href = NFC_SOCIALS.tiktok);
  ['socialInstagram','ddInstagram'].forEach(id=>document.getElementById(id).href = NFC_SOCIALS.instagram);

  function initials(name){
    return name.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();
  }

  function renderBout(bout){
    return `
      <div class="vs-fighter">
        <div class="vs-fname">${bout.a.name}</div>
      </div>
      <div class="vs-divider display">VS</div>
      <div class="vs-fighter">
        <div class="vs-fname">${bout.b.name}</div>
      </div>
    `;
  }

  function formatEventLine(dateStr){
    const d = new Date(dateStr);
    if(isNaN(d.getTime())){
      return dateStr;
    }
    const weekday = d.toLocaleDateString('en-US', { weekday: 'short' });
    const month = d.toLocaleDateString('en-US', { month: 'short' });
    return `${weekday}, ${month} ${d.getDate()} / 10:00 PM CDT / Main Card`;
  }

  function renderInfo(bout, date){
    return `
      <div class="info-line date-line">${formatEventLine(date)}</div>
    `;
  }

  function renderActions(bout){
    return `
      <a class="btn-outline" href="${bout.a.slug}.html">${bout.a.name}</a>
      <a class="btn-outline" href="${bout.b.slug}.html">${bout.b.name}</a>
    `;
  }

  const listEl = document.getElementById('eventList');

  EVENTS.forEach((event, eIdx)=>{
    const row = document.createElement('div');
    row.className = 'event-row';
    row.id = event.number.toLowerCase().replace(/\s+/g,'');

    let boutIndex = 0;

    row.innerHTML = `
      <div class="event-logo">
        <div class="brand-word display">NFC</div>
        <div class="elogo-num display">${event.number.replace('NFC','').trim()}</div>
        <div class="elogo-date">${event.date}</div>
      </div>
      <div class="fight-carousel">
        <button class="arrow prev" ${event.bouts.length<2?'disabled':''}>‹</button>
        <div class="fight-slide"></div>
        <button class="arrow next" ${event.bouts.length<2?'disabled':''}>›</button>
      </div>
      <div class="event-info"></div>
      <div class="event-actions"></div>
    `;

    const slideEl = row.querySelector('.fight-slide');
    const infoEl = row.querySelector('.event-info');
    const actionsEl = row.querySelector('.event-actions');
    const prevBtn = row.querySelector('.arrow.prev');
    const nextBtn = row.querySelector('.arrow.next');

    function update(){
      const bout = event.bouts[boutIndex];
      slideEl.innerHTML = renderBout(bout);
      infoEl.innerHTML = renderInfo(bout, event.date);
      actionsEl.innerHTML = renderActions(bout);
      prevBtn.disabled = boutIndex === 0;
      nextBtn.disabled = boutIndex === event.bouts.length - 1;
    }

    prevBtn.addEventListener('click', ()=>{ if(boutIndex>0){ boutIndex--; update(); } });
    nextBtn.addEventListener('click', ()=>{ if(boutIndex<event.bouts.length-1){ boutIndex++; update(); } });

    update();
    listEl.appendChild(row);
  });
</script>

</body>
